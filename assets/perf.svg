</style><rect class="bg" x="0.5" y="0.5" width="839" height="355" rx="12"/><text class="m mu" x="32" y="40" font-size="12" letter-spacing="1">CASE STUDY · POS PRODUCT LISTING API</text><text class="fg" x="32" y="76" font-size="28" font-weight="800">Measure <tspan class="ac">&gt;</tspan> Guess</text><text class="m mu" x="32" y="122" font-size="12" letter-spacing="1">TIME TO FIRST BYTE  <tspan class="good" letter-spacing="0">≈85× faster</tspan></text><text class="fg" x="808" y="126" font-size="30" font-weight="800" text-anchor="end">~200ms</text><text class="m mu" x="32" y="157" font-size="12">before</text><rect class="s2" x="130" y="144" width="540" height="16" rx="3"/><rect class="miss" x="130" y="144" width="540.0" height="16" rx="3"/><text class="m fg" x="682" y="157" font-size="12">~17,000ms</text><text class="m mu" x="32" y="187" font-size="12">after</text><rect class="s2" x="130" y="174" width="540" height="16" rx="3"/><rect class="good" x="130" y="174" width="6.4" height="16" rx="3"/><text class="m fg" x="682" y="187" font-size="12">~200ms</text><text class="m mu" x="32" y="232" font-size="12" letter-spacing="1">RESPONSE PAYLOAD  <tspan class="good" letter-spacing="0">−85% smaller</tspan></text><text class="fg" x="808" y="236" font-size="30" font-weight="800" text-anchor="end">~4KB</text><text class="m mu" x="32" y="267" font-size="12">before</text><rect class="s2" x="130" y="254" width="540" height="16" rx="3"/><rect class="miss" x="130" y="254" width="540.0" height="16" rx="3"/><text class="m fg" x="682" y="267" font-size="12">~26KB</text><text class="m mu" x="32" y="297" font-size="12">after</text><rect class="s2" x="130" y="284" width="540" height="16" rx="3"/><rect class="good" x="130" y="284" width="83.1" height="16" rx="3"/><text class="m fg" x="682" y="297" font-size="12">~4KB</text><text class="m mu" x="32" y="336" font-size="11">bars share one linear scale per metric</text></svg>